<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="container">
        <section class="main">
            <header>
                <h1>To Do List</h1>
            </header>
            <main>
                <section class="input">
                    <input type="text" id="inputText" required>
                <button id="addBtn">Add</button>
                </section>
                <h3 id="taskList">Task List</h3>
                <hr>
                <p id="comp">Completed : 0 | Uncompleted : 0</p>
            </main>
        </section>
        <footer>
            <p>Made by - Vipin Singh Rawat</p>
        </footer>
    </section>
    <script src="script.js"></script>
</body>
</html>
